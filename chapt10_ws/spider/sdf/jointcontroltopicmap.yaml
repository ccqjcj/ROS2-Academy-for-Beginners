#publish the spider pose info
- ros_topic_name: "pose"
  gz_topic_name: "/world/spider/dynamic_pose/info"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "ignition.msgs.Pose_V"
  lazy: false
  direction: GZ_TO_ROS 

#publish the robot joint states to ros
#ros2 run ros_gz_bridge parameter_bridge /world/spider/model/spider/joint_state@sensor_msgs/msg/JointState[ignition.msgs.Model

- ros_topic_name: "joint_states"
  gz_topic_name: "/world/spider/model/spider/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  lazy: false
  direction: GZ_TO_ROS  # Default "BIDIRECTIONAL" - Bridge both directions
                            # "GZ_TO_ROS" - Bridge Ignition topic to ROS
                            # "ROS_TO_GZ" - Bridge ROS topic to Ignition
