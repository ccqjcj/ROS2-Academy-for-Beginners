# the command to start ros bridge
# ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=./jointcontrol.yaml

#positon controller, the ros send the position, and the gazebo accept the position and run
- ros_topic_name: "l1leg1j"
  gz_topic_name: "/model/spider/joint/l1leg1j/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  lazy: true
  direction: ROS_TO_GZ  
  

